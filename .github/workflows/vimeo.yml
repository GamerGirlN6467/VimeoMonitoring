name: Scheduled Vimeo Monitor

permissions:
  contents: write

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Python script
        run: python search.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          DISCORD_MUTED_WEBHOOK_URL: ${{ secrets.DISCORD_MUTED_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
          SEARCH_QUERIES: ${{ secrets.SEARCH_QUERIES }}
          MONITORED_USERS: ${{ secrets.MONITORED_USERS }}
          INTEREST_PROFILE: ${{ secrets.INTEREST_PROFILE }}
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          AI_ROUTING_ENABLED: 'true'
          KNOWN_LINKS_FILE: known_vimeo_links.txt

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit links
        run: |
          if git diff --quiet -- known_vimeo_links.txt; then
            echo "No new links to commit."
            exit 0
          fi
          git add -- known_vimeo_links.txt
          git commit -m "Update links"
          git push
